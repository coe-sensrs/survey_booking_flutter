<body class="bg-background text-on-background min-h-screen flex flex-col">

<header class="fixed top-0 z-50 bg-surface dark:bg-surface-dim border-b border-outline-variant dark:border-outline w-full h-16 flex items-center px-gutter max-w-container-max mx-auto">

<h1 class="font-headline-md text-headline-md font-bold text-primary dark:text-primary-fixed-dim">Survey Booking</h1>

    <div class="w-10 h-10 rounded-full bg-surface-container-lowest border-2 border-surface-container-highest text-on-surface-variant flex items-center justify-center">

    <span class="mt-xs font-headline text-label-md font-semibold text-on-surface-variant">Review</span>
  </div>
</div></section>

<!-- Service Grid / List -->
<div class="space-y-sm" id="service-list">
<!-- Socio Economic Survey -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer hidden" name="survey_type" type="radio" value="socio">
<div class="flex items-center p-md border border-outline-variant rounded-lg bg-surface-container-lowest transition-all hover:shadow-sm peer-checked:selected-card group-active:scale-[0.98]">

<span class="material-symbols-outlined" data-icon="assignment">assignment</span>
</div>
<div class="flex-grow">
<h3 class="font-semibold text-on-surface">Socio Economic Survey</h3>
<p class="text-caption text-on-surface-variant font-body">Demographic data collection and analysis</p>
</div>
<div class="text-primary opacity-0 peer-checked:opacity-100 transition-opacity">
<span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>

</div>

</div>
</div>

</div>
</div>

</div>

<label class="relative block cursor-pointer group">

</button>

<!-- Footer -->

<script>
        // Micro-interactions for radio selections
        const radioButtons = document.querySelectorAll('input[name="survey_type"]');
        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                // Additional UI feedback logic can go here if needed
            });
        });

        // Simple next button logic
        const nextBtn = document.querySelector('button .material-symbols-outlined[data-icon="arrow_forward"]').parentElement;
        nextBtn.addEventListener('click', () => {
            // Ripple or feedback
            const ripple = document.createElement('div');
            ripple.className = 'absolute bg-white/20 rounded-full animate-ping h-8 w-8';
            nextBtn.appendChild(ripple);
            setTimeout(() => ripple.remove(), 500);
            
            console.log("Proceeding to next step...");
        });
