<body class="min-h-screen flex flex-col font-body-lg text-body-lg antialiased">
<!-- Top App Bar (Suppressing Navigation Shell for Transactional Screen per Rules, but keeping a minimal brand header) -->
<header class="bg-surface w-full top-0 sticky flex justify-between items-center px-4 h-16 shadow-sm z-50">
<div class="flex items-center gap-2">


</div>
</header>
<main class="flex-grow flex flex-col md:flex-row w-full h-full md:h-[calc(100vh-64px)]">
<!-- Image Section (Matches Login Screen) -->
<section class="w-full md:w-1/2 h-64 md:h-full relative overflow-hidden">

<!-- Overlay to ensure text legibility if needed, though mostly decorative -->
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div>
</section>
<!-- Form Section -->
<section class="w-full md:w-1/2 flex items-center justify-center p-margin-mobile md:p-margin-desktop bg-surface-container-lowest">
<div class="w-full max-w-md flex flex-col gap-lg">
<!-- Header & Toggle -->
<div class="flex flex-col gap-md items-center text-center">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Create an Account</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Join the community to start sharing your insights.</p>
<!-- Toggle -->
<div class="flex bg-surface-container-highest p-1 rounded-full w-full max-w-xs mt-sm">
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-label-md text-on-surface-variant hover:bg-surface-variant transition-colors" type="button">Log In</button>
<button class="flex-1 py-2 px-4 rounded-full font-label-md text-label-md bg-primary-container text-on-primary-container font-bold shadow-sm" type="button">Sign Up</button>
</div>
</div>
<!-- Sign Up Form -->
<form class="flex flex-col gap-md w-full">
<!-- Full Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">person</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="fullName" name="fullName" placeholder="Jane Doe" type="text">
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="jane@example.com" type="email">
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg border border-outline-variant bg-surface focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-shadow font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant" id="password" name="password" placeholder="••••••••" type="password">
</div>
</div>
<!-- Submit Button -->
<button class="w-full mt-sm py-3 px-6 bg-primary hover:bg-surface-tint text-on-primary rounded-lg font-label-md text-label-md transition-colors active:scale-[0.98]" type="submit">
                        Sign Up
                    </button>
<div class="text-center mt-sm">
<p class="font-body-lg text-body-lg text-on-surface-variant text-sm">By signing up, you agree to our <a class="text-primary hover:underline" href="#">Terms of Service</a> and <a class="text-primary hover:underline" href="#">Privacy Policy</a>.</p>
</div>
</form>
</div>
</section>
</main>
