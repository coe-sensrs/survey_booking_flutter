<!DOCTYPE html><html class="h-full" lang="en" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Admin Portal Login - Research Systems</title>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Literata (Serif) for headings and Inter (Sans) for UI -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,700;1,7..72,400&amp;display=swap" rel="stylesheet">
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'research-green': '#4a7c59',
            'research-surface': '#f9faf7',
          },
          fontFamily: {
            serif: ['Literata', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
        }
      }
    }
  </script>
<style data-purpose="custom-typography">
    .font-literata { font-family: 'Literata', serif; }
    .font-inter { font-family: 'Inter', sans-serif; }
  </style>
<style data-purpose="layout-refinements">
    body {
      background-color: #f2f4f0; /* Soft off-white with hint of sage */
    }
    .login-card {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
    }
    .input-shadow {
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.02);
    }
  </style>
</head>
<body class="h-full font-inter text-slate-800 flex flex-col justify-between p-6">
<!-- BEGIN: BrandingSection -->
<header class="mt-12 flex flex-col items-center text-center" data-purpose="portal-branding">
<!-- Abstract Research Icon (Replacing the original with a cleaner SVG version) -->
<div class="mb-6 opacity-80" data-purpose="logo-container">
<svg aria-hidden="true" fill="none" height="120" viewBox="0 0 100 100" width="120" xmlns="http://www.w3.org/2000/svg">
<circle cx="50" cy="50" r="48" stroke="#4a7c59" stroke-dasharray="2 2" stroke-width="1"></circle>
<path d="M50 5L50 95M5 50L95 50" stroke="#4a7c59" stroke-width="0.5"></path>
<path d="M20 20L80 80M80 20L20 80" stroke="#4a7c59" stroke-dasharray="1 1" stroke-width="0.5"></path>
<circle cx="50" cy="50" r="30" stroke="#4a7c59" stroke-width="1.5"></circle>
<path d="M50 20V50L70 60" stroke="#4a7c59" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<rect height="30" stroke="#4a7c59" stroke-width="1" transform="rotate(45 50 50)" width="30" x="35" y="35"></rect>
</svg>
</div>
<h1 class="text-4xl font-literata font-bold text-slate-900 tracking-tight">Admin Portal</h1>
<p class="mt-2 text-slate-500 font-medium tracking-wide uppercase text-xs">Institutional Access Only</p>
</header>
<!-- END: BrandingSection -->
<!-- BEGIN: LoginFormSection -->
<main class="flex-grow flex items-center justify-center py-8">
<div class="w-full max-w-sm bg-white rounded-2xl border border-slate-100 login-card overflow-hidden" data-purpose="login-form-card">
<!-- Decorative Top Border -->
<div class="h-1.5 w-full bg-research-green"></div>
<form class="p-8 space-y-6">
<!-- Admin ID Field -->
<div data-purpose="input-group">
<label class="block text-sm font-semibold text-slate-700 mb-2" for="admin-id">Admin ID / Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-research-green/20 focus:border-research-green transition-all input-shadow" id="admin-id" name="admin-id" placeholder="Enter your credentials" type="text">
</div>
</div>
<!-- Password Field -->
<div data-purpose="input-group">
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-slate-700" for="password">Password</label>
<a class="text-xs font-semibold text-research-green hover:underline" href="#">Recover Access</a>
</div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</div>
<input class="block w-full pl-11 pr-4 py-3.5 bg-white border border-slate-200 rounded-xl text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-research-green/20 focus:border-research-green transition-all input-shadow" id="password" name="password" placeholder="Password" type="password">
<button type="button" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-research-green transition-colors" aria-label="Toggle password visibility"><svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg></button></div>
</div>
<!-- Submit Button -->
<button class="w-full flex items-center justify-center py-4 px-4 border border-transparent rounded-xl shadow-sm text-base font-semibold text-white bg-research-green hover:bg-[#3d664a] active:scale-[0.98] transition-all focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-research-green" type="submit">
<svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
          Authorize Access
        </button>
</form>
</div>
</main>
<!-- END: LoginFormSection -->
<!-- BEGIN: SecurityFooter -->
<footer class="mb-4 text-center px-4" data-purpose="security-notice">
<p class="text-[10px] leading-relaxed text-slate-400 font-medium uppercase tracking-widest max-w-[280px] mx-auto"><br></p>
</footer>
<!-- END: SecurityFooter -->


</body></html>
