<!DOCTYPE html><html lang="en" style=""><head><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Authentication</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#4a7c59',
            surface: '#f7faf4',
            surfaceDim: '#d8dbd5',
            surfaceContainerLow: '#f1f5ef',
            textMain: '#1a1d1a',
            textMuted: '#424943',
          },
          fontFamily: {
            serif: ['Literata', 'serif'],
            sans: ['system-ui', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&display=swap');
    
    body {
      font-family: 'Literata', serif;
      background-color: #f1f5ef; /* surfaceContainerLow */
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .auth-card {
      background-color: white;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      width: 100%;
      max-width: 400px;
      margin: 1rem;
    }

    .image-header {
      position: relative;
      height: 200px;
      width: 100%;
    }

    .image-header img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-header::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to top, white, transparent);
    }
  </style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&amp;display=swap" data-snapdom="injected-import"></head>
<body>
<!-- BEGIN: MainAuthCard -->
<main class="auth-card">
<!-- BEGIN: HeaderImage -->
<div class="image-header">

</div>
<!-- END: HeaderImage -->
<div class="p-6">
<!-- BEGIN: Toggle -->
<div class="flex p-1 bg-surfaceDim rounded-full mb-8">
<button class="flex-1 py-2 text-center bg-white rounded-full text-textMain shadow-sm font-medium">Log In</button>
<button class="flex-1 py-2 text-center text-textMuted font-medium hover:text-textMain transition-colors">Sign Up</button>
</div>
<!-- END: Toggle -->
<!-- BEGIN: Titles -->
<h1 class="text-3xl font-bold text-textMain mb-2 font-serif">Welcome Back</h1>
<p class="text-textMuted mb-6 font-sans">Please enter your details to sign in.</p>
<!-- END: Titles -->
<!-- BEGIN: Form -->
<form class="space-y-4 font-sans">
<!-- Email Field -->
<div>
<label class="block text-sm font-medium text-textMain mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-3 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary sm:text-sm text-textMain" id="email" placeholder="jane@institution.edu" type="email">
</div>
</div>
<!-- Password Field -->
<div>
<label class="block text-sm font-medium text-textMain mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<input class="block w-full pl-10 pr-10 py-2 border border-gray-300 rounded-lg focus:ring-primary focus:border-primary sm:text-sm text-textMain" id="password" type="password" value="••••••••">
<div class="absolute inset-y-0 right-0 pr-3 flex items-center">
<button class="text-gray-400 hover:text-gray-500 focus:outline-none focus:text-gray-500" type="button">
<svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</div>
<div class="flex justify-end">
<a class="text-sm font-medium text-primary hover:text-primary/80" href="#">Forgot Password?</a>
</div>
<!-- Submit Button -->
<button class="w-full flex justify-center items-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-primary hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors" type="submit">
          Sign In
          <svg class="ml-2 h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</form>
<!-- END: Form -->
<!-- BEGIN: Social Login -->
<div class="mt-6">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-gray-300"></div>
</div>
<div class="relative flex justify-center text-sm font-sans">
<span class="px-2 bg-white text-textMuted">or continue with</span>
</div>
</div>
<div class="mt-6">
<button class="w-full inline-flex justify-center py-2.5 px-4 border border-gray-300 rounded-lg shadow-sm bg-white text-sm font-medium text-textMain hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors font-sans items-center gap-2" type="button">
<svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Google
          </button>
</div><div class="mt-6 text-center">
  <a href="#" class="text-sm font-medium text-textMuted hover:text-primary transition-colors font-sans">
    Are you an administrator? <span class="text-primary">Admin Login</span>
  </a>
</div>
</div>
<!-- END: Social Login -->
</div>
</main>
<!-- END: MainAuthCard -->






</body></html>
